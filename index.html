<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>বাংলাদেশ মেলা</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; padding-bottom: 70px; }
        
        /* হেডার */
        .header { background: #fff; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e0e0e0; position: sticky; top: 0; z-index: 100; }
        .logo h1 { font-size: 1.3rem; background: linear-gradient(135deg, #1a1a1a, #555); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .logo p { font-size: 0.65rem; color: #888; }
        .header-right { display: flex; gap: 10px; align-items: center; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #d4af37; cursor: pointer; object-fit: cover; }
        .avatar.hide { display: none; }
        .signin-btn { background: #2e7d32; color: #fff; border: none; padding: 4px 12px; border-radius: 20px; font-size: 0.65rem; cursor: pointer; }
        .help-btn { background: none; border: none; font-size: 1.4rem; color: #555; cursor: pointer; padding: 4px; }
        
        /* সার্চ বার (হেডারের নিচে) */
        .search-section { background: #fff; padding: 0 16px; max-height: 0; overflow: hidden; transition: 0.3s; border-bottom: 1px solid #e0e0e0; position: sticky; top: 62px; z-index: 99; }
        .search-section.open { max-height: 180px; padding: 10px 16px; }
        .search-box { background: #f0f2f5; border-radius: 30px; padding: 8px 16px; display: flex; gap: 10px; margin-bottom: 10px; border: 1px solid #ddd; }
        .search-box input { flex: 1; border: none; background: transparent; outline: none; font-size: 0.85rem; }
        .filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .filter-select { flex: 1; background: #f8f9fa; border: 1px solid #ddd; border-radius: 30px; padding: 6px 12px; font-size: 0.65rem; outline: none; min-width: 60px; cursor: pointer; }
        .filter-select:focus { border-color: #d4af37; }
        .clear-filter { background: none; border: none; color: #dc3545; font-size: 0.7rem; cursor: pointer; padding: 0 8px; }
        
        /* স্লাইডার */
        .slider-wrap { padding: 0 16px; margin-top: 80px; }
        .slider-container { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 16/9; background: #ddd; }
        .slides-track { display: flex; width: 100%; height: 100%; transition: transform 0.5s; }
        .slide { flex: 0 0 100%; height: 100%; cursor: pointer; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        .arrow-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.8); border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; z-index: 5; }
        .arrow-left { left: 8px; }
        .arrow-right { right: 8px; }
        .dots { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: #ccc; cursor: pointer; }
        .dot.active { background: #1a1f2e; width: 20px; border-radius: 10px; }
        
        /* চলন্ত লেখা */
        .marquee-wrap { padding: 0 16px; margin: 10px 0; }
        .marquee-box { background: #fff; border-radius: 8px; padding: 8px 12px; border: 1px solid #e0e0e0; overflow: hidden; }
        .marquee-text { display: inline-block; white-space: nowrap; animation: scroll 18s linear infinite; font-weight: 600; color: #1a1a1a; }
        .marquee-text i { color: #b8860b; background: rgba(184,134,11,0.08); padding: 0 8px; border-radius: 4px; }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        /* স্ট্যাটিস্টিক্স */
        .stats { background: #fff; margin: 10px 16px; padding: 12px; border-radius: 16px; display: flex; justify-content: space-around; text-align: center; }
        .stat-num { font-size: 1.4rem; font-weight: 700; }
        .stat-label { font-size: 0.6rem; color: #888; }
        
        /* পোস্ট গ্রিড */
        .section-title { padding: 0 16px; margin: 12px 0 8px; font-size: 1rem; }
        .posts-grid { padding: 0 16px; display: flex; flex-direction: column; gap: 16px; }
        .post-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .post-header { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
        .post-title { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .badge-live { background: #2e7d32; color: #fff; font-size: 0.55rem; padding: 2px 8px; border-radius: 20px; }
        .badge-soon { background: #f57c00; color: #fff; font-size: 0.55rem; padding: 2px 8px; border-radius: 20px; }
        .post-body { padding: 12px 16px; }
        .post-desc { font-size: 0.85rem; color: #444; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
        .post-desc.open { -webkit-line-clamp: unset; }
        .post-info { display: flex; flex-wrap: wrap; gap: 12px; background: #f8f9fa; padding: 8px 12px; border-radius: 10px; margin: 8px 0; font-size: 0.75rem; color: #555; }
        .post-info i { width: 18px; color: #00c853; }
        .post-footer { padding: 8px 16px; border-top: 1px solid #f0f0f0; display: flex; gap: 16px; flex-wrap: wrap; }
        .action-btn { background: none; border: none; font-size: 0.8rem; color: #666; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 4px 0; }
        .action-btn:hover { color: #1a1a1a; }
        .action-btn.liked { color: #1877f2; }
        .action-btn.saved { color: #f39c12; }
        
        /* নিচের মেনু */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; justify-content: space-around; align-items: center; padding: 6px 12px; border-top: 1px solid #e0e0e0; z-index: 200; min-height: 56px; }
        .nav-item { background: none; border: none; display: flex; flex-direction: column; align-items: center; color: #aaa; font-size: 0.5rem; cursor: pointer; padding: 4px 8px; }
        .nav-item i { font-size: 1.2rem; }
        .nav-item.active { color: #1a1a1a; }
        .nav-center { background: #1a1a1a; color: #fff; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -24px; }
        .nav-center i { font-size: 1.4rem; color: #fff; }
        
        /* মোডাল */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 300; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: #fff; width: 92%; max-width: 450px; max-height: 85vh; border-radius: 24px; overflow-y: auto; padding: 20px; position: relative; }
        .modal-close { position: absolute; top: 12px; right: 16px; font-size: 1.4rem; cursor: pointer; color: #999; }
        .modal img { width: 100%; border-radius: 12px; aspect-ratio: 16/9; object-fit: cover; }
        .modal-title { font-size: 1.2rem; font-weight: 700; color: #b8860b; text-align: center; margin: 10px 0; }
        .modal-info { margin: 6px 0; font-size: 0.85rem; color: #444; }
        .modal-info strong { color: #1a1a1a; }
        
        .loader { text-align: center; padding: 40px; color: #888; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #00e676; padding: 6px 18px; border-radius: 30px; font-size: 0.75rem; z-index: 400; opacity: 0; transition: 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        
        .search-active .slider-wrap,
        .search-active .marquee-wrap,
        .search-active .stats { display: none !important; }
        
        @media (max-width: 480px) {
            .logo h1 { font-size: 1.1rem; }
            .slider-wrap { margin-top: 70px; }
        }
    </style>
</head>
<body>

<!-- ===== হেডার ===== -->
<div class="header">
    <div class="logo">
        <h1>বাংলাদেশ মেলা</h1>
        <p>দেশের মেলার ঠিকানা</p>
    </div>
    <div class="header-right">
        <button class="signin-btn" id="signinBtn">লগইন</button>
        <img class="avatar hide" id="userAvatar" src="" alt="avatar">
        <button class="help-btn" id="helpBtn"><i class="fa-regular fa-circle-question"></i></button>
    </div>
</div>

<!-- ===== সার্চ সেকশন ===== -->
<div class="search-section" id="searchSection">
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="মেলার নাম, জেলা, বিভাগ লিখুন...">
    </div>
    <div class="filter-row">
        <select id="divisionFilter" class="filter-select"><option value="">সব বিভাগ</option></select>
        <select id="districtFilter" class="filter-select"><option value="">সব জেলা</option></select>
        <select id="upazilaFilter" class="filter-select"><option value="">সব উপজেলা</option></select>
        <button class="clear-filter" onclick="clearAllFilters()"><i class="fa-regular fa-eraser"></i></button>
    </div>
</div>

<!-- ===== স্লাইডার ===== -->
<div class="slider-wrap" id="sliderWrap">
    <div class="slider-container" id="sliderContainer">
        <div class="slides-track" id="slidesTrack"></div>
        <button class="arrow-btn arrow-left" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="arrow-btn arrow-right" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
    <div class="dots" id="dotContainer"></div>
</div>

<!-- ===== চলন্ত লেখা ===== -->
<div class="marquee-wrap" id="marqueeWrap">
    <div class="marquee-box">
        <div class="marquee-text" id="marqueeText">✦ ক্রিয়েটিভ <i>ডিজাইন</i> • ইউনিক <i>ভিশন</i> • আনকমন <i>স্টাইল</i> • ফিউচার <i>লুক</i></div>
    </div>
</div>

<!-- ===== স্ট্যাটিস্টিক্স ===== -->
<div class="stats" id="statsWrap">
    <div><div class="stat-num" id="statLive">0</div><div class="stat-label">চলমান</div></div>
    <div><div class="stat-num" id="statSoon">0</div><div class="stat-label">আসন্ন</div></div>
    <div><div class="stat-num" id="statEnded">0</div><div class="stat-label">সমাপ্ত</div></div>
    <div><div class="stat-num" id="statReviews">0</div><div class="stat-label">রিভিউ</div></div>
</div>

<!-- ===== পোস্ট গ্রিড ===== -->
<div class="section-title"><h3><i class="fa-regular fa-newspaper"></i> সর্বশেষ মেলার খবর</h3></div>
<div class="posts-grid" id="postsContainer"><div class="loader">লোড হচ্ছে...</div></div>

<!-- ===== নিচের মেনু ===== -->
<div class="bottom-nav">
    <button class="nav-item active" id="navTime"><i class="fa-regular fa-calendar"></i><span>সময়</span></button>
    <button class="nav-item" id="navSearch"><i class="fa-solid fa-magnifying-glass"></i><span>সার্চ</span></button>
    <button class="nav-item nav-center" id="navCreate"><i class="fa-solid fa-plus"></i></button>
    <button class="nav-item" id="navSaved"><i class="fa-regular fa-bookmark"></i><span>সেভ</span></button>
    <button class="nav-item" id="navTopic"><i class="fa-solid fa-th-large"></i><span>বিষয়</span></button>
</div>

<!-- ===== মোডাল (স্লাইডার ডিটেইল) ===== -->
<div class="modal" id="slideModal">
    <div class="modal-content">
        <span class="modal-close" id="closeSlideModal">&times;</span>
        <div id="slideModalBody"></div>
    </div>
</div>

<!-- ===== টোস্ট ===== -->
<div class="toast" id="toast"></div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyCZ6L7QiarIOIeiK62HEdaSyr84ORVKwl4",
        authDomain: "pikaribazar-e5f17.firebaseapp.com",
        databaseURL: "https://pikaribazar-e5f17-default-rtdb.firebaseio.com",
        projectId: "pikaribazar-e5f17",
        storageBucket: "pikaribazar-e5f17.firebasestorage.app",
        messagingSenderId: "819295862018",
        appId: "1:819295862018:web:c24937bebb24be75cd961b"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    
    // ===== ভেরিয়েবল =====
    let slideData = [];
    let slideIndex = 0;
    let slideTimer = null;
    let allPosts = [];
    let divisionsData = [];
    let categoriesData = [];
    let savedIds = [];
    let currentUser = null;
    let searchText = "";
    let selectedDivision = "", selectedDistrict = "", selectedUpazila = "";
    let selectedTime = "all";
    let selectedTopics = [];
    let statusFilter = "all";
    
    // ===== ডিভিশন লোড =====
    async function loadDivisions() {
        try {
            const res = await fetch('divisions.json');
            const data = await res.json();
            divisionsData = data.divisions || [];
        } catch(e) {
            divisionsData = [{ name: "ঢাকা", districts: [{ name: "ঢাকা", upazilas: ["ঢাকা সদর"] }] }];
        }
        populateFilters();
    }
    
    function populateFilters() {
        const divSelect = document.getElementById('divisionFilter');
        divSelect.innerHTML = '<option value="">সব বিভাগ</option>';
        divisionsData.forEach(d => divSelect.add(new Option(d.name, d.name)));
        divSelect.onchange = function() {
            selectedDivision = this.value;
            updateDistrictFilter(selectedDivision);
            applyFilters();
        };
    }
    
    function updateDistrictFilter(division) {
        const distSelect = document.getElementById('districtFilter');
        distSelect.innerHTML = '<option value="">সব জেলা</option>';
        const div = divisionsData.find(d => d.name === division);
        if (div && div.districts) {
            div.districts.forEach(d => distSelect.add(new Option(d.name, d.name)));
        }
        distSelect.onchange = function() {
            selectedDistrict = this.value;
            updateUpazilaFilter(division, selectedDistrict);
            applyFilters();
        };
    }
    
    function updateUpazilaFilter(division, district) {
        const upazilaSelect = document.getElementById('upazilaFilter');
        upazilaSelect.innerHTML = '<option value="">সব উপজেলা</option>';
        const div = divisionsData.find(d => d.name === division);
        const dist = div?.districts?.find(d => d.name === district);
        if (dist && dist.upazilas) {
            dist.upazilas.forEach(u => upazilaSelect.add(new Option(u, u)));
        }
        upazilaSelect.onchange = function() {
            selectedUpazila = this.value;
            applyFilters();
        };
    }
    
    // ===== ক্যাটাগরি লোড =====
    async function loadCategories() {
        try {
            const res = await fetch('mela-category.json');
            const data = await res.json();
            categoriesData = data.categories || [];
        } catch(e) {
            categoriesData = [
                { name: "কৃষি মেলা", icon: "🌾" },
                { name: "বাণিজ্য মেলা", icon: "💼" },
                { name: "সাংস্কৃতিক মেলা", icon: "🎭" },
                { name: "বইমেলা", icon: "📚" },
                { name: "খাবার মেলা", icon: "🍽️" },
                { name: "অন্যান্য", icon: "🎪" }
            ];
        }
    }
    
    // ===== স্লাইডার =====
    const DEFAULT_SLIDES = [
        { id: 'd1', imageUrl: 'https://images.unsplash.com/photo-1558618666-fcd25c85f6b3?w=800&h=450&fit=crop', title: 'বাংলাদেশ মেলা', description: 'দেশের মেলার ঠিকানা' },
        { id: 'd2', imageUrl: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800&h=450&fit=crop', title: 'পাহাড়ি মেলা', description: 'পাহাড়ের কোলে মেলার আয়োজন' },
        { id: 'd3', imageUrl: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&h=450&fit=crop', title: 'সমুদ্র মেলা', description: 'সৈকতে বসে মেলা ও উৎসব' }
    ];
    
    async function loadSlides() {
        try {
            const snap = await db.ref('sliderImages').once('value');
            const data = snap.val();
            if (data && Object.keys(data).length > 0) {
                slideData = Object.keys(data).map(k => ({ id: k, ...data[k] }));
                slideData.sort((a,b) => (a.order||0) - (b.order||0));
            } else {
                slideData = DEFAULT_SLIDES;
            }
        } catch(e) {
            slideData = DEFAULT_SLIDES;
        }
        renderSlider();
    }
    
    function renderSlider() {
        const track = document.getElementById('slidesTrack');
        const dots = document.getElementById('dotContainer');
        track.innerHTML = slideData.map((s, i) => `
            <div class="slide" onclick="openSlideDetail('${s.id}')">
                <img src="${s.imageUrl}" alt="${s.title || ''}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1558618666-fcd25c85f6b3?w=800&h=450&fit=crop'">
            </div>
        `).join('');
        dots.innerHTML = slideData.map((_, i) => `<span class="dot ${i===0?'active':''}" onclick="goToSlide(${i})"></span>`).join('');
        slideIndex = 0;
        showSlide(0);
        startAutoPlay();
    }
    
    function showSlide(i) {
        const track = document.getElementById('slidesTrack');
        const dots = document.querySelectorAll('.dot');
        if (!track || track.children.length === 0) return;
        slideIndex = i;
        track.style.transform = `translateX(-${i * 100}%)`;
        dots.forEach((d, idx) => d.classList.toggle('active', idx === i));
    }
    
    function goToSlide(i) { stopAutoPlay(); showSlide(i); startAutoPlay(); }
    function nextSlide() { showSlide((slideIndex + 1) % slideData.length); }
    function prevSlide() { showSlide((slideIndex - 1 + slideData.length) % slideData.length); }
    
    function startAutoPlay() {
        stopAutoPlay();
        if (slideData.length > 1) slideTimer = setInterval(nextSlide, 4000);
    }
    function stopAutoPlay() { if (slideTimer) { clearInterval(slideTimer); slideTimer = null; } }
    
    document.getElementById('prevBtn').addEventListener('click', () => { stopAutoPlay(); prevSlide(); startAutoPlay(); });
    document.getElementById('nextBtn').addEventListener('click', () => { stopAutoPlay(); nextSlide(); startAutoPlay(); });
    
    // স্লাইড টাচ
    let touchX = 0;
    document.getElementById('sliderContainer').addEventListener('touchstart', e => { touchX = e.changedTouches[0].screenX; }, {passive:true});
    document.getElementById('sliderContainer').addEventListener('touchend', e => {
        const diff = touchX - e.changedTouches[0].screenX;
        if (Math.abs(diff) > 30) {
            stopAutoPlay();
            if (diff > 0) nextSlide(); else prevSlide();
            startAutoPlay();
        }
    }, {passive:true});
    
    // স্লাইড ডিটেইল মোডাল
    window.openSlideDetail = function(id) {
        const slide = slideData.find(s => s.id === id) || slideData[0];
        if (!slide) return;
        const body = document.getElementById('slideModalBody');
        body.innerHTML = `
            <img src="${slide.imageUrl}" alt="${slide.title || ''}" onerror="this.src='https://images.unsplash.com/photo-1558618666-fcd25c85f6b3?w=800&h=450&fit=crop'">
            <div class="modal-title">${slide.title || 'বাংলাদেশ মেলা'}</div>
            <div class="modal-info"><strong>📝 বিবরণ:</strong> ${slide.description || 'কোনো বিবরণ নেই'}</div>
            ${slide.melaType ? `<div class="modal-info"><strong>🏷️ ধরন:</strong> ${slide.melaType}</div>` : ''}
            ${slide.startDate ? `<div class="modal-info"><strong>⏰ সময়:</strong> ${new Date(slide.startDate).toLocaleDateString('bn-BD')} - ${new Date(slide.endDate).toLocaleDateString('bn-BD')}</div>` : ''}
            ${slide.division ? `<div class="modal-info"><strong>📍 ঠিকানা:</strong> ${slide.district || ''}, ${slide.division || ''}</div>` : ''}
            ${slide.link ? `<div class="modal-info"><a href="${slide.link}" target="_blank" style="color:#b8860b;">🔗 বিস্তারিত দেখুন</a></div>` : ''}
        `;
        document.getElementById('slideModal').classList.add('show');
    };
    document.getElementById('closeSlideModal').onclick = () => document.getElementById('slideModal').classList.remove('show');
    document.getElementById('slideModal').addEventListener('click', e => { if (e.target === e.currentTarget) document.getElementById('slideModal').classList.remove('show'); });
    
    // ===== মার্কি টেক্সট =====
    async function loadMarquee() {
        try {
            const snap = await db.ref('marqueeText').once('value');
            const data = snap.val();
            if (data && data.text) {
                document.getElementById('marqueeText').innerHTML = data.text;
            }
        } catch(e) {}
    }
    
    // ===== পোস্ট =====
    async function loadPosts() {
        const snap = await db.ref('posts').once('value');
        const data = snap.val();
        allPosts = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
        allPosts.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
        applyFilters();
    }
    
    function applyFilters() {
        let filtered = allPosts.filter(p => {
            if (statusFilter !== "all") {
                const status = getStatus(p);
                if (status !== statusFilter) return false;
            }
            if (selectedTime !== "all" && p.category !== selectedTime) return false;
            if (selectedTopics.length > 0 && !selectedTopics.includes(p.topicCategory)) return false;
            if (selectedDivision && p.division !== selectedDivision) return false;
            if (selectedDistrict && p.district !== selectedDistrict) return false;
            if (selectedUpazila && p.upazila !== selectedUpazila) return false;
            if (searchText) {
                const s = searchText.toLowerCase();
                return (p.title?.toLowerCase().includes(s) || p.district?.toLowerCase().includes(s) || p.division?.toLowerCase().includes(s));
            }
            return true;
        });
        renderPosts(filtered);
        updateStats();
    }
    
    function getStatus(p) {
        if (!p.startDate || !p.endDate) return 'soon';
        const now = new Date();
        const start = new Date(p.startDate);
        const end = new Date(p.endDate);
        if (end < now) return 'ended';
        if (start <= now && end >= now) return 'live';
        return 'soon';
    }
    
    function updateStats() {
        const live = allPosts.filter(p => getStatus(p) === 'live').length;
        const soon = allPosts.filter(p => getStatus(p) === 'soon').length;
        const ended = allPosts.filter(p => getStatus(p) === 'ended').length;
        document.getElementById('statLive').textContent = live;
        document.getElementById('statSoon').textContent = soon;
        document.getElementById('statEnded').textContent = ended;
        let reviews = 0;
        allPosts.forEach(p => { if (p.comments) reviews += Object.keys(p.comments).length; });
        document.getElementById('statReviews').textContent = reviews;
    }
    
    function renderPosts(posts) {
        const container = document.getElementById('postsContainer');
        if (!posts || posts.length === 0) {
            container.innerHTML = '<div class="loader">😢 কোনো মেলা পাওয়া যায়নি</div>';
            return;
        }
        container.innerHTML = posts.map(p => {
            const status = getStatus(p);
            const badge = status === 'live' ? '<span class="badge-live">চলমান</span>' : (status === 'soon' ? '<span class="badge-soon">আসন্ন</span>' : '');
            const isSaved = savedIds.includes(p.id);
            return `
                <div class="post-card" data-id="${p.id}">
                    <div class="post-header">
                        <div class="post-title">${badge} ${escapeHtml(p.title)}</div>
                    </div>
                    <div class="post-body">
                        <div class="post-info">
                            <span><i class="fa-regular fa-calendar"></i> ${formatDate(p.startDate)} - ${formatDate(p.endDate)}</span>
                            <span><i class="fa-solid fa-location-dot"></i> ${escapeHtml(p.district)}, ${escapeHtml(p.division)}</span>
                        </div>
                        <div class="post-desc" onclick="this.classList.toggle('open')">${escapeHtml(p.description || 'কোনো বিবরণ নেই')}</div>
                    </div>
                    <div class="post-footer">
                        <button class="action-btn like-btn" data-id="${p.id}"><i class="fa-regular fa-thumbs-up"></i> <span class="count">${Object.keys(p.reactions||{}).length}</span></button>
                        <button class="action-btn save-btn ${isSaved?'saved':''}" data-id="${p.id}"><i class="fa-${isSaved?'solid':'regular'} fa-bookmark"></i></button>
                        <button class="action-btn" onclick="viewPostDetail('${p.id}')"><i class="fa-regular fa-eye"></i> দেখুন</button>
                    </div>
                </div>
            `;
        }).join('');
        
        // লাইক
        document.querySelectorAll('.like-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (!currentUser) { showToast('লাইক দিতে লগইন করুন'); return; }
                const id = this.dataset.id;
                const post = allPosts.find(p => p.id === id);
                if (!post) return;
                const reactions = post.reactions || {};
                if (reactions[currentUser.uid]) {
                    delete reactions[currentUser.uid];
                } else {
                    reactions[currentUser.uid] = { type: 'like', emoji: '👍' };
                }
                db.ref(`posts/${id}/reactions`).set(reactions);
                loadPosts();
            });
        });
        
        // সেভ
        document.querySelectorAll('.save-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (!currentUser) { showToast('সেভ করতে লগইন করুন'); return; }
                const id = this.dataset.id;
                toggleSave(id);
            });
        });
    }
    
    async function toggleSave(id) {
        if (!currentUser) return;
        const ref = db.ref(`users/${currentUser.uid}/savedPosts`);
        const snap = await ref.once('value');
        let saved = snap.val() || [];
        if (saved.includes(id)) {
            saved = saved.filter(s => s !== id);
        } else {
            saved.push(id);
        }
        await ref.set(saved);
        savedIds = saved;
        loadPosts();
        showToast(saved.includes(id) ? '⭐ সেভ হয়েছে' : '❌ সেভ বাতিল');
    }
    
    function viewPostDetail(id) {
        const post = allPosts.find(p => p.id === id);
        if (!post) return;
        const body = document.getElementById('slideModalBody');
        const status = getStatus(post);
        body.innerHTML = `
            <div class="modal-title">${escapeHtml(post.title)}</div>
            <div class="modal-info"><strong>🏷️ ধরন:</strong> ${escapeHtml(post.melaType || 'অন্যান্য')}</div>
            <div class="modal-info"><strong>⏰ সময়:</strong> ${formatDate(post.startDate)} - ${formatDate(post.endDate)} (${status === 'live' ? '🟢 চলমান' : (status === 'soon' ? '🟠 আসন্ন' : '⚫ সমাপ্ত')})</div>
            <div class="modal-info"><strong>📍 ঠিকানা:</strong> ${escapeHtml(post.district)}, ${escapeHtml(post.division)}</div>
            <div class="modal-info"><strong>📝 বিবরণ:</strong> ${escapeHtml(post.description || 'কোনো বিবরণ নেই')}</div>
            ${post.contacts && post.contacts.length > 0 ? `<div class="modal-info"><strong>📞 যোগাযোগ:</strong> ${post.contacts.map(c => `${c.name}: ${c.phone}`).join(', ')}</div>` : ''}
            ${post.locationLink ? `<div class="modal-info"><a href="${post.locationLink}" target="_blank" style="color:#b8860b;">🗺️ গুগল ম্যাপে দেখুন</a></div>` : ''}
        `;
        document.getElementById('slideModal').classList.add('show');
    }
    
    function formatDate(d) { if (!d) return 'N/A'; return new Date(d).toLocaleDateString('bn-BD'); }
    function escapeHtml(s) { if (!s) return ''; return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
    function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
    
    // ===== সার্চ ফাংশন =====
    function applyFiltersAndSearch() {
        const input = document.getElementById('searchInput');
        searchText = input.value.trim();
        const hasSearch = searchText.length > 0;
        const hasFilter = document.getElementById('divisionFilter').value !== '' ||
                          document.getElementById('districtFilter').value !== '' ||
                          document.getElementById('upazilaFilter').value !== '';
        document.body.classList.toggle('search-active', hasSearch || hasFilter);
        applyFilters();
    }
    
    document.getElementById('searchInput').addEventListener('input', applyFiltersAndSearch);
    
    function clearAllFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('divisionFilter').value = '';
        document.getElementById('districtFilter').innerHTML = '<option value="">সব জেলা</option>';
        document.getElementById('upazilaFilter').innerHTML = '<option value="">সব উপজেলা</option>';
        selectedDivision = '';
        selectedDistrict = '';
        selectedUpazila = '';
        searchText = '';
        document.body.classList.remove('search-active');
        applyFilters();
        showToast('সব ফিল্টার রিসেট হয়েছে');
    }
    
    // ===== UI =====
    document.getElementById('signinBtn').onclick = () => window.location.href = 'mela-login.html';
    document.getElementById('helpBtn').onclick = () => window.location.href = 'mela-help.html';
    document.getElementById('navSearch').onclick = function() {
        document.getElementById('searchSection').classList.toggle('open');
        if (document.getElementById('searchSection').classList.contains('open')) {
            document.getElementById('searchInput').focus();
        }
    };
    document.getElementById('navCreate').onclick = () => {
        if (!currentUser) { showToast('পোস্ট করতে লগইন করুন'); return; }
        window.location.href = 'mela-post.html';
    };
    document.getElementById('navSaved').onclick = () => {
        if (!currentUser) { showToast('সেভ দেখতে লগইন করুন'); return; }
        const saved = allPosts.filter(p => savedIds.includes(p.id));
        if (saved.length === 0) { showToast('কোনো সেভড মেলা নেই'); return; }
        const body = document.getElementById('slideModalBody');
        body.innerHTML = saved.map(p => `
            <div style="padding:10px;border-bottom:1px solid #eee;cursor:pointer;" onclick="viewPostDetail('${p.id}')">
                <strong>${escapeHtml(p.title)}</strong><br>
                <small>${escapeHtml(p.district)}, ${escapeHtml(p.division)}</small>
            </div>
        `).join('');
        document.getElementById('slideModal').classList.add('show');
    };
    
    // ===== অথেন্টিকেশন =====
    auth.onAuthStateChanged(user => {
        currentUser = user;
        const avatar = document.getElementById('userAvatar');
        const signinBtn = document.getElementById('signinBtn');
        if (user) {
            signinBtn.classList.add('hide');
            avatar.classList.remove('hide');
            avatar.src = user.photoURL || 'https://ui-avatars.com/api/?name=User';
        } else {
            signinBtn.classList.remove('hide');
            avatar.classList.add('hide');
            savedIds = [];
        }
    });
    
    // ===== ইনিশিয়াল =====
    async function init() {
        await loadDivisions();
        await loadCategories();
        await loadSlides();
        await loadMarquee();
        await loadPosts();
        if (currentUser) {
            const snap = await db.ref(`users/${currentUser.uid}/savedPosts`).once('value');
            savedIds = snap.val() || [];
        }
    }
    init();
</script>
</body>
</html>
