<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>বাংলাদেশ মেলা অ্যাপস | গোল্ডেন স্লাইডার</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #e8e8e8;
      min-height: 100vh;
      font-family: 'Segoe UI', 'Poppins', 'Noto Sans Bengali', system-ui, sans-serif;
      padding-bottom: 20px;
    }

    /* হেডার স্টাইল */
    .app-header {
      background: white;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e0e0e0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .menu-icon {
      font-size: 1.5rem;
      cursor: pointer;
      color: #333;
    }
    .logo-area h1 {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #b8860b, #d4af37);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .logo-area p {
      font-size: 0.55rem;
      color: #888;
    }
    .header-icons {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .signin-btn {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* গোল্ডেন স্লাইডার - কন্টেইনার */
    .slider-wrapper {
      max-width: 640px;
      margin: 16px auto;
      padding: 0 16px;
    }
    .billboard {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.15), 0 0 0 2px rgba(212, 175, 55, 0.3);
      position: relative;
      border-radius: 24px;
    }
    .screen {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .content-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      touch-action: pan-y pinch-zoom;
    }
    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      overflow-y: auto;
      padding: 20px;
    }
    .slide.active {
      opacity: 1;
      z-index: 10;
    }
    .news-card {
      background: #ffffff;
      width: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border-radius: 20px;
      position: relative;
      cursor: pointer;
    }
    .status-type-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      background: transparent;
      padding: 2px 20px;
      border-radius: 50px;
      margin-top: 2px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 1.2rem;
      font-weight: bold;
    }
    .status-badge.running { color: #4caf50; }
    .status-badge.upcoming { color: #ff9800; }
    .blinking-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #4caf50;
      animation: blink 1.2s infinite;
    }
    @keyframes blink {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }
    .static-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ff9800;
    }
    .separator {
      color: #b8860b;
      font-size: 1.2rem;
      font-weight: bold;
    }
    .mela-type-text {
      font-size: 1.2rem;
      font-weight: bold;
      color: #b8860b;
      background: transparent;
    }
    .title {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #b8860b, #d4af37, #ffd700);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-top: 20px;
      margin-bottom: 10px;
      line-height: 1.3;
      text-align: center;
      padding: 0 15px;
    }
    .desc {
      font-size: 1.2rem;
      color: #6b6b6b;
      line-height: 1.6;
      margin-bottom: 15px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-align: center;
      padding: 0 15px;
    }
    .slide-indicators {
      position: absolute;
      bottom: 15px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 20;
    }
    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.3);
      transition: all 0.3s;
      cursor: pointer;
    }
    .indicator.active {
      width: 20px;
      border-radius: 10px;
      background: #d4af37;
    }

    /* চলন্ত লেখা (মারকি) */
    .marquee-container {
      background: linear-gradient(90deg, #1a1a2e, #16213e);
      padding: 10px 0;
      overflow: hidden;
      margin: 0 16px 16px 16px;
      border-radius: 40px;
    }
    .marquee-text {
      white-space: nowrap;
      display: inline-block;
      animation: scrollText 30s linear infinite;
      color: #d4af37;
      font-weight: 500;
      font-size: 0.9rem;
    }
    .marquee-text span {
      margin: 0 20px;
    }
    @keyframes scrollText {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }

    /* পোস্ট গ্রিড */
    .posts-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 0 16px;
      max-width: 640px;
      margin: 0 auto;
    }
    .post-card {
      background: white;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: all 0.2s;
    }
    .post-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    .post-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    .post-meta {
      font-size: 0.75rem;
      color: #888;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .post-desc {
      font-size: 0.85rem;
      color: #555;
      margin-top: 8px;
      line-height: 1.4;
    }

    /* মোডাল */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      width: 90%;
      max-width: 500px;
      max-height: 80%;
      border-radius: 24px;
      padding: 20px;
      overflow-y: auto;
      position: relative;
    }
    .close-modal {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      cursor: pointer;
      color: #999;
    }
    .modal-title {
      font-size: 1.3rem;
      font-weight: bold;
      background: linear-gradient(135deg, #b8860b, #d4af37);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 15px;
      text-align: center;
    }
    .modal-section {
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    .contact-item {
      padding: 6px 0;
      font-size: 0.85rem;
    }
    .contact-item a {
      color: #b8860b;
      text-decoration: none;
    }
    .map-link-btn {
      display: inline-block;
      background: linear-gradient(115deg, #d4af37, #c49b2a);
      color: white;
      padding: 8px 16px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 0.8rem;
      margin-top: 5px;
    }

    @media (max-width: 550px) {
      .title { font-size: 1.6rem; margin-top: 15px; }
      .desc { font-size: 1rem; }
      .status-badge { font-size: 1rem; }
      .mela-type-text { font-size: 1rem; }
      .separator { font-size: 1rem; }
      .slide { padding: 15px; }
      .blinking-dot, .static-dot { width: 14px; height: 14px; }
      .marquee-text { font-size: 0.75rem; }
    }
  </style>
</head>
<body>

<!-- হেডার -->
<div class="app-header">
  <div class="logo-area">
    <i class="fa-solid fa-bars menu-icon" id="menuIcon"></i>
    <div>
      <h1>বাংলাদেশ মেলা</h1>
      <p>দেশের মেলার ঠিকানা</p>
    </div>
  </div>
  <div class="header-icons">
    <button class="signin-btn" id="signinBtn">লগইন</button>
  </div>
</div>

<!-- গোল্ডেন স্লাইডার -->
<div class="slider-wrapper">
  <div class="billboard">
    <div class="screen">
      <div class="content-container" id="slidesContainer">
        <div class="slide active">
          <div class="news-card">
            <div style="text-align:center; padding:40px;">🎪 লোড হচ্ছে...</div>
          </div>
        </div>
      </div>
      <div class="slide-indicators" id="indicators"></div>
    </div>
  </div>
</div>

<!-- চলন্ত লেখা (মারকি) -->
<div class="marquee-container">
  <div class="marquee-text" id="marqueeText">
    <span>🎪 আসসালামু আলাইকুম</span>
    <span>✨ বাংলাদেশ মেলা অ্যাপসে আপনাকে স্বাগতম</span>
    <span>🏮 দেশের সকল মেলার তথ্য পাবেন এখানে</span>
    <span>📢 ব্যবসা মানে লাভ লোকসান - নিজ দায়িত্বে সিদ্ধান্ত নিন</span>
    <span>📍 লোকেশন যাচাই করে নিন</span>
  </div>
</div>

<!-- পোস্ট গ্রিড -->
<div class="posts-grid" id="postsContainer">
  <div class="post-card" style="text-align:center; color:#888;">🎪 লোড হচ্ছে...</div>
</div>

<!-- মোডাল -->
<div id="detailModal" class="modal">
  <div class="modal-content">
    <span class="close-modal">&times;</span>
    <div id="modalBody"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAKRgsUrYL4uAWinn5dcJrKck1nqUokRdw",
    authDomain: "all-hadith-a68fa.firebaseapp.com",
    projectId: "all-hadith-a68fa",
    databaseURL: "https://all-hadith-a68fa-default-rtdb.firebaseio.com/",
    storageBucket: "all-hadith-a68fa.firebasestorage.app",
    messagingSenderId: "124928027736",
    appId: "1:124928027736:android:f4d9a9a9ed667150ca2e2d"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  let slides = [];
  let currentIndex = 0;
  let interval;
  let touchStartX = 0;
  let touchEndX = 0;

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function getStatus(startDate, endDate) {
    if (!startDate || !endDate) return 'upcoming';
    const now = new Date();
    const start = new Date(startDate);
    const end = new Date(endDate);
    if (now >= start && now <= end) return 'running';
    return 'upcoming';
  }

  function formatDateTime(dateStr) {
    if (!dateStr) return 'N/A';
    const d = new Date(dateStr);
    return d.toLocaleString('bn-BD');
  }

  window.showModalById = function(id, event) {
    if (event) event.stopPropagation();
    const card = slides.find(s => s.id === id);
    if (!card) return;
    
    const modal = document.getElementById('detailModal');
    const modalBody = document.getElementById('modalBody');
    const status = getStatus(card.startDate, card.endDate);
    const statusText = status === 'running' ? 'চলমান' : 'আসন্ন';
    const statusIcon = status === 'running' ? '🟢' : '🟠';
    
    let contactsHtml = '';
    if (card.contacts && card.contacts.length > 0) {
      card.contacts.forEach(c => {
        contactsHtml += `<div class="contact-item">👤 ${escapeHtml(c.name)}: <a href="tel:${escapeHtml(c.phone)}">${escapeHtml(c.phone)}</a></div>`;
      });
    } else {
      contactsHtml = '<div>কোনো যোগাযোগ তথ্য নেই</div>';
    }

    const mapHtml = card.mapLink ? `<div><a href="${escapeHtml(card.mapLink)}" target="_blank" class="map-link-btn">🗺️ গুগল ম্যাপে দেখুন</a></div>` : '';

    modalBody.innerHTML = `
      <div class="modal-title">${escapeHtml(card.title)}</div>
      <div class="modal-section">
        <div><strong>📅 মেলার ধরন:</strong> ${escapeHtml(card.melaType)} (${card.days || ''} দিনব্যাপী)</div>
        <div style="margin-top:5px;"><strong>স্ট্যাটাস:</strong> ${statusIcon} ${statusText}</div>
      </div>
      <div class="modal-section">
        <div><strong>📝 বিস্তারিত বিবরণ:</strong></div>
        <div style="margin-top:5px; line-height:1.5;">${escapeHtml(card.description)}</div>
      </div>
      <div class="modal-section">
        <div><strong>📍 ঠিকানা/লোকেশন:</strong></div>
        <div>${escapeHtml(card.address || 'ঠিকানা দেওয়া নেই')}</div>
      </div>
      <div class="modal-section">
        <div><strong>📞 যোগাযোগ করুন:</strong></div>
        ${contactsHtml}
      </div>
      <div class="modal-section">
        <div><strong>🗓️ সময়কাল:</strong></div>
        <div>শুরু: ${formatDateTime(card.startDate)}</div>
        <div>শেষ: ${formatDateTime(card.endDate)}</div>
      </div>
      ${mapHtml ? `<div class="modal-section">${mapHtml}</div>` : ''}
    `;
    modal.style.display = 'flex';
  };

  function createSlideHTML(card, idx) {
    const status = getStatus(card.startDate, card.endDate);
    const isRunning = status === 'running';
    const statusText = isRunning ? 'চলমান' : 'আসন্ন';
    const dotHtml = isRunning ? '<span class="blinking-dot"></span>' : '<span class="static-dot"></span>';
    
    return `
      <div class="slide" data-id="${card.id}" data-index="${idx}">
        <div class="news-card" onclick="showModalById('${card.id}', event)">
          <div class="title">${escapeHtml(card.title)}</div>
          <div class="status-type-wrapper">
            <div class="status-badge ${isRunning ? 'running' : 'upcoming'}">
              ${dotHtml} ${statusText}
            </div>
            <span class="separator">|</span>
            <span class="mela-type-text">${escapeHtml(card.melaType)} (${card.days || ''} দিন)</span>
          </div>
          <div class="desc">${escapeHtml(card.description).substring(0, 120)}${card.description.length > 120 ? '...' : ''}</div>
        </div>
      </div>
    `;
  }

  function handleTouchStart(event) {
    touchStartX = event.changedTouches[0].screenX;
  }

  function handleTouchEnd(event) {
    touchEndX = event.changedTouches[0].screenX;
    const swipeDistance = touchEndX - touchStartX;
    const minSwipeDistance = 50;
    if (Math.abs(swipeDistance) > minSwipeDistance) {
      if (swipeDistance > 0) prevSlide();
      else nextSlide();
    }
  }

  function prevSlide() {
    if (slides.length === 0) return;
    currentIndex = (currentIndex - 1 + slides.length) % slides.length;
    showSlide(currentIndex);
    startSlideshow();
  }

  function nextSlide() {
    if (slides.length === 0) return;
    currentIndex = (currentIndex + 1) % slides.length;
    showSlide(currentIndex);
    startSlideshow();
  }

  function renderSlides() {
    const container = document.getElementById('slidesContainer');
    const indicatorsDiv = document.getElementById('indicators');
    
    if (!slides || slides.length === 0) {
      container.innerHTML = `<div class="slide active"><div class="news-card"><div style="text-align:center; padding:40px;">🎪 কোনো মেলার তথ্য নেই<br>অ্যাডমিন প্যানেল থেকে যোগ করুন</div></div></div>`;
      indicatorsDiv.innerHTML = '<div class="indicator active"></div>';
      return;
    }

    let slidesHtml = '';
    slides.forEach((slide, idx) => {
      slidesHtml += createSlideHTML(slide, idx);
    });
    container.innerHTML = slidesHtml;

    let indicatorsHtml = '';
    for (let i = 0; i < slides.length; i++) {
      indicatorsHtml += `<div class="indicator ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`;
    }
    indicatorsDiv.innerHTML = indicatorsHtml;

    document.querySelectorAll('.indicator').forEach(ind => {
      ind.addEventListener('click', (e) => {
        const index = parseInt(e.target.getAttribute('data-index'));
        if (!isNaN(index)) goToSlide(index);
      });
    });

    const sliderContainer = document.querySelector('.content-container');
    sliderContainer.addEventListener('touchstart', handleTouchStart, false);
    sliderContainer.addEventListener('touchend', handleTouchEnd, false);

    currentIndex = 0;
    showSlide(0);
    startSlideshow();
  }

  function showSlide(index) {
    const allSlides = document.querySelectorAll('.slide');
    const indicators = document.querySelectorAll('.indicator');
    allSlides.forEach(s => s.classList.remove('active'));
    indicators.forEach(i => i.classList.remove('active'));
    if (allSlides[index]) allSlides[index].classList.add('active');
    if (indicators[index]) indicators[index].classList.add('active');
  }

  function goToSlide(index) {
    if (slides.length === 0) return;
    currentIndex = index;
    showSlide(currentIndex);
    startSlideshow();
  }

  function startSlideshow() {
    if (interval) clearInterval(interval);
    if (slides.length > 1) interval = setInterval(() => {
      nextSlide();
    }, 5000);
  }

  // পোস্ট গ্রিড লোড করার ফাংশন
  async function loadPostGrid() {
    const container = document.getElementById('postsContainer');
    try {
      const snapshot = await database.ref('melaPosts').once('value');
      const data = snapshot.val();
      if (!data) {
        container.innerHTML = '<div class="post-card" style="text-align:center;">🎪 কোনো পোস্ট নেই</div>';
        return;
      }
      
      const posts = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      posts.sort((a, b) => (a.order || 0) - (b.order || 0));
      
      let html = '';
      posts.forEach(post => {
        html += `
          <div class="post-card" onclick="showModalById('${post.id}', event)">
            <div class="post-title">${escapeHtml(post.title)}</div>
            <div class="post-meta">
              <span><i class="fa-regular fa-calendar"></i> ${post.melaType || ''}</span>
              <span><i class="fa-regular fa-location-dot"></i> ${escapeHtml(post.address || 'ঠিকানা নেই')}</span>
            </div>
            <div class="post-desc">${escapeHtml(post.description).substring(0, 100)}${post.description?.length > 100 ? '...' : ''}</div>
          </div>
        `;
      });
      container.innerHTML = html;
    } catch (error) {
      console.error("Error loading posts:", error);
      container.innerHTML = '<div class="post-card" style="text-align:center;">⚠️ পোস্ট লোড করতে সমস্যা হয়েছে</div>';
    }
  }

  // Firebase Realtime Database লোড (স্লাইডারের জন্য)
  const melaPostsRef = database.ref('melaPosts');
  melaPostsRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      slides = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      slides.sort((a, b) => (a.order || 0) - (b.order || 0));
    } else {
      slides = [];
    }
    renderSlides();
    loadPostGrid();
  });

  // মোডাল ক্লোজ
  document.querySelector('.close-modal').onclick = () => {
    document.getElementById('detailModal').style.display = 'none';
  };
  window.onclick = (e) => {
    if (e.target === document.getElementById('detailModal')) {
      document.getElementById('detailModal').style.display = 'none';
    }
  };

  // লগইন বাটন
  document.getElementById('signinBtn').onclick = () => {
    window.location.href = 'login.html';
  };

  // মেনু আইকন (ঐচ্ছিক)
  document.getElementById('menuIcon').onclick = () => {
    alert('মেনু শীঘ্রই যোগ করা হবে');
  };
</script>
</body>
</html>
