<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>বাংলাদেশ মেলা - দেশের মেলার সন্ধান</title>
    
    <!-- Firebase SDK (Realtime DB সহ) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0f1724, #090e16);
            min-height: 100vh;
            color: #f0f0f0;
        }

        .gaming-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,215,0,0.05));
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(255,215,0,0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(255,215,0,0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .gaming-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 35px rgba(255,215,0,0.5);
        }

        .neon-gold {
            background: linear-gradient(45deg, #ffd966, #ffaa33);
            border: none;
            color: #1a1a2e;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px #ffaa33;
        }
        .neon-gold:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #ffcc44;
        }

        .marquee-3d {
            background: linear-gradient(90deg, #2a1a3a, #1a2a3a);
            padding: 14px;
            border-radius: 50px;
            margin: 20px 0;
            border-left: 5px solid gold;
            overflow: hidden;
        }
        .marquee-3d p {
            animation: slideText 22s linear infinite;
            white-space: nowrap;
        }
        @keyframes slideText {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .search-3d {
            background: rgba(10,20,30,0.7);
            backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 8px 20px;
            border: 1px solid rgba(255,215,0,0.4);
        }

        .chip-3d {
            background: linear-gradient(135deg, #1e2a3a, #0f1722);
            border-radius: 40px;
            padding: 10px 24px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(255,215,0,0.3);
            display: inline-block;
        }
        .chip-active {
            background: linear-gradient(135deg, #ffd966, #ffaa33);
            color: #0a0a1a;
            box-shadow: 0 0 15px gold;
        }

        .post-3d {
            background: linear-gradient(145deg, #111927, #0b1018);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
            border-right: 4px solid #ffd966;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0f1a;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #ffd966, #ff884d);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div style="max-width: 700px; margin: 0 auto; padding: 16px 20px;">
        
        <!-- হেডার -->
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px 0;">
            <div>
                <h1 style="font-size: 2rem; background: linear-gradient(135deg, #FFE6B0, #FFB347); -webkit-background-clip: text; background-clip: text; color: transparent;">
                    🇧🇩 বাংলাদেশ মেলা
                </h1>
                <p style="color: #ffd966;">✨ দেশের মেলার হাব ✨</p>
            </div>
            <div style="position: relative;">
                <button id="supportBtn" class="neon-gold" style="padding: 10px 18px;">
                    <i class="fa-regular fa-life-ring"></i> সাপোর্ট
                </button>
                <div id="supportDropdown" style="display: none; position: absolute; right: 0; top: 55px; width: 280px; background: #1a1f2e; border-radius: 20px; padding: 16px; border: 1px solid gold; z-index: 1000;">
                    <p><i class="fa-solid fa-phone-alt"></i> <strong>হটলাইন:</strong> <span id="contactNumberSpan">০১৯৯৯-৮৮৮৭৭৭</span></p>
                    <hr style="margin: 8px 0;">
                    <p><i class="fa-regular fa-compass"></i> <strong>কীভাবে ব্যবহার করবেন?</strong></p>
                    <ul style="margin-left: 18px; font-size: 0.85rem;">
                        <li>🔍 সার্চ দিয়ে মেলা খুঁজুন</li>
                        <li>📝 পোস্ট করুন (শুধু টেক্সট)</li>
                        <li>❤️ লাইক দিন | 💬 কমেন্ট করুন | ⭐ সেভ করুন</li>
                    </ul>
                    <button id="closeSupport" style="margin-top: 12px; background: #333; width: 100%; padding: 8px; border-radius: 20px;">বন্ধ</button>
                </div>
            </div>
        </div>

        <!-- সার্চ বার -->
        <div class="search-3d" style="display: flex; gap: 12px; margin: 20px 0;">
            <i class="fa-solid fa-magnifying-glass" style="margin-top: 14px; color: #ffd966;"></i>
            <input type="text" id="searchInput" placeholder="মেলার নাম, জেলা, উপজেলা লিখুন..." style="flex:1; background: transparent; border: none; color: white; font-size: 1rem; outline: none;">
        </div>

        <!-- বিভাগ ফিল্টার -->
        <div id="divisionContainer" style="display: flex; gap: 10px; overflow-x: auto; margin: 15px 0;"></div>

        <!-- ইমেজ স্লাইডার (শুধু এডমিনের URL) -->
        <div id="imageSlider" style="display: flex; gap: 15px; overflow-x: auto; margin: 20px 0;"></div>

        <!-- চলন্ত লেখা -->
        <div class="marquee-3d">
            <p>🎊 স্বাগতম বাংলাদেশ মেলায় 🎊 লাইক, কমেন্ট, সেভ করুন আর মজা নিন 🎊</p>
        </div>

        <!-- ক্যাটাগরি ট্যাব -->
        <div style="display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0;">
            <button data-cat="all" class="chip-3d chip-active">🔥 সব মেলা</button>
            <button data-cat="চলমান" class="chip-3d">🎪 চলমান</button>
            <button data-cat="আসন্ন" class="chip-3d">⏳ আসন্ন</button>
            <button data-cat="সাপ্তাহিক" class="chip-3d">🛒 সাপ্তাহিক</button>
        </div>

        <!-- পোস্ট কন্টেইনার -->
        <div id="postsContainer"></div>

        <!-- পোস্ট বাটন -->
        <button id="createPostFab" class="neon-gold" style="position: fixed; bottom: 25px; right: 25px; border-radius: 60px; padding: 15px 25px;">
            <i class="fa-regular fa-pen-to-square"></i> পোস্ট করুন
        </button>
    </div>

    <!-- পোস্ট মডাল -->
    <div id="postModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); align-items: center; justify-content: center; z-index: 10000;">
        <div class="gaming-card" style="width: 90%; max-width: 500px; padding: 25px;">
            <h2>📝 নতুন মেলা তথ্য</h2>
            <input type="text" id="postTitle" placeholder="মেলার নাম *" style="width: 100%; margin: 10px 0; padding: 12px; border-radius: 30px;">
            <select id="postDivision" style="width: 100%; padding: 12px; border-radius: 30px; margin: 10px 0;"></select>
            <select id="postDistrict" style="width: 100%; padding: 12px; border-radius: 30px; margin: 10px 0;"></select>
            <input type="text" id="postUpazila" placeholder="উপজেলা / থানা" style="width: 100%; margin: 8px 0; padding: 12px; border-radius: 30px;">
            <input type="date" id="startDate" style="width: 48%; margin-right: 4%; padding: 10px; border-radius: 30px;">
            <input type="date" id="endDate" style="width: 48%; padding: 10px; border-radius: 30px;">
            <textarea id="postDesc" rows="3" placeholder="বিস্তারিত বিবরণ..." style="width: 100%; margin: 10px 0; padding: 12px; border-radius: 20px;"></textarea>
            <select id="postCategory" style="width: 100%; margin: 10px 0; padding: 12px; border-radius: 30px;">
                <option value="চলমান">চলমান</option>
                <option value="আসন্ন">আসন্ন</option>
                <option value="সাপ্তাহিক">সাপ্তাহিক</option>
            </select>
            <button id="submitPostBtn" class="neon-gold" style="width: 100%;">পোস্ট করুন</button>
            <button id="closeModalBtn" style="background: #444; margin-top: 12px; width: 100%; padding: 10px; border-radius: 30px;">বাতিল</button>
        </div>
    </div>

    <script>
        // Firebase কনফিগারেশন (আপনার নিজের বসান)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const provider = new firebase.auth.GoogleAuthProvider();

        let currentUser = null;
        let activeCategory = "all";
        let searchText = "";
        let selectedDivision = "";

        // গুগল অটো লগইন
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadDivisions();
                await loadSliderImages();
                await loadContactNumber();
                loadPosts();
                document.getElementById("createPostFab").style.display = "flex";
            } else {
                await auth.signInWithPopup(provider);
            }
        });

        // divisions.json লোড
        async function loadDivisions() {
            try {
                const res = await fetch('divisions.json');
                const data = await res.json();
                const container = document.getElementById("divisionContainer");
                container.innerHTML = `<button data-div="" class="chip-3d chip-active">সব বিভাগ</button>`;
                data.divisions.forEach(div => {
                    let btn = document.createElement("button");
                    btn.innerText = div.name;
                    btn.classList.add("chip-3d");
                    btn.dataset.div = div.name;
                    btn.onclick = () => {
                        selectedDivision = div.name;
                        loadPosts();
                        document.querySelectorAll("#divisionContainer .chip-3d").forEach(b => b.classList.remove("chip-active"));
                        btn.classList.add("chip-active");
                    };
                    container.appendChild(btn);
                });
                
                // পোস্ট মডালের জন্য বিভাগ
                const divSelect = document.getElementById("postDivision");
                divSelect.innerHTML = "";
                data.divisions.forEach(div => {
                    let opt = document.createElement("option");
                    opt.value = div.name;
                    opt.innerText = div.name;
                    divSelect.appendChild(opt);
                });
                window.divisionsData = data;
            } catch(e) { console.error("divisions.json লোড ব্যর্থ", e); }
        }

        // স্লাইডার ইমেজ লোড
        async function loadSliderImages() {
            const snapshot = await db.ref('settings/imageSlider/images').once('value');
            const images = snapshot.val() || [];
            const sliderDiv = document.getElementById("imageSlider");
            if(images.length === 0) {
                sliderDiv.innerHTML = '<div class="gaming-card" style="padding: 20px;">🌟 প্রোমো স্লাইডার শীঘ্রই আসছে</div>';
                return;
            }
            sliderDiv.innerHTML = images.map(img => `
                <div style="min-width: 260px; cursor: pointer;" onclick="window.open('${img.link}', '_blank')">
                    <img src="${img.url}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 28px; border: 2px solid gold;">
                </div>
            `).join('');
        }

        // কন্টাক্ট নম্বর লোড
        async function loadContactNumber() {
            const snapshot = await db.ref('settings/contact/number').once('value');
            if(snapshot.exists()) {
                document.getElementById("contactNumberSpan").innerText = snapshot.val();
            }
        }

        // পোস্ট লোড
        async function loadPosts() {
            const snapshot = await db.ref('posts').once('value');
            let posts = [];
            snapshot.forEach(child => {
                posts.push({ id: child.key, ...child.val() });
            });
            posts.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
            
            const filtered = posts.filter(p => {
                if(activeCategory !== "all" && p.category !== activeCategory) return false;
                if(selectedDivision && p.division !== selectedDivision) return false;
                if(searchText && !(p.title?.includes(searchText) || p.district?.includes(searchText) || p.upazila?.includes(searchText))) return false;
                return true;
            });
            renderPosts(filtered);
        }

        async function renderPosts(posts) {
            const container = document.getElementById("postsContainer");
            container.innerHTML = "";
            
            for(const post of posts) {
                const likeCount = post.likes ? Object.keys(post.likes).length : 0;
                const commentCount = post.comments ? Object.keys(post.comments).length : 0;
                const isLiked = post.likes && post.likes[currentUser?.uid];
                const isSaved = await isPostSaved(post.id);
                
                const postDiv = document.createElement("div");
                postDiv.className = "post-3d gaming-card";
                postDiv.innerHTML = `
                    <div style="display: flex; justify-content: space-between;">
                        <h3>🎪 ${post.title}</h3>
                        <span class="chip-3d" style="background: #ffd96620;">${post.category}</span>
                    </div>
                    <p style="color: #ffd966; margin: 10px 0;"><i class="fa-solid fa-location-dot"></i> ${post.division} > ${post.district}</p>
                    <p><i class="fa-regular fa-calendar"></i> ${post.startDate} → ${post.endDate}</p>
                    <p>📝 ${post.description?.substring(0, 100)}</p>
                    <div style="display: flex; gap: 20px; margin: 15px 0 0 0;">
                        <button class="like-btn" data-id="${post.id}" style="background: none; border: none; color: ${isLiked ? '#ff4444' : '#fff'}; font-size: 1.3rem;">
                            <i class="fa-${isLiked ? 'solid' : 'regular'} fa-heart"></i> <span>${likeCount}</span>
                        </button>
                        <button class="comment-btn" data-id="${post.id}" style="background: none; border: none; color: #aaffdd; font-size: 1.2rem;">
                            <i class="fa-regular fa-comment-dots"></i> ${commentCount}
                        </button>
                        <button class="save-btn" data-id="${post.id}" style="background: none; border: none; color: ${isSaved ? '#ffd966' : '#ccc'}; font-size: 1.3rem;">
                            <i class="fa-${isSaved ? 'solid' : 'regular'} fa-bookmark"></i> সেভ
                        </button>
                    </div>
                    <div id="comments-${post.id}" style="display: none; margin-top: 15px;"></div>
                `;
                container.appendChild(postDiv);
                
                postDiv.querySelector(".like-btn").onclick = () => toggleLike(post.id);
                postDiv.querySelector(".save-btn").onclick = () => toggleSave(post.id);
                postDiv.querySelector(".comment-btn").onclick = () => {
                    const commentDiv = document.getElementById(`comments-${post.id}`);
                    if(commentDiv.style.display === "none") {
                        commentDiv.style.display = "block";
                        loadComments(post.id, commentDiv);
                    } else {
                        commentDiv.style.display = "none";
                    }
                };
            }
        }

        async function isPostSaved(postId) {
            const snapshot = await db.ref(`users/${currentUser.uid}/savedPosts`).once('value');
            const saved = snapshot.val() || [];
            return saved.includes(postId);
        }

        async function toggleLike(postId) {
            const likeRef = db.ref(`posts/${postId}/likes/${currentUser.uid}`);
            const snapshot = await likeRef.once('value');
            if(snapshot.exists()) {
                await likeRef.remove();
            } else {
                await likeRef.set(true);
            }
            loadPosts();
        }

        async function toggleSave(postId) {
            const userRef = db.ref(`users/${currentUser.uid}/savedPosts`);
            const snapshot = await userRef.once('value');
            let saved = snapshot.val() || [];
            if(saved.includes(postId)) {
                saved = saved.filter(id => id !== postId);
            } else {
                saved.push(postId);
            }
            await userRef.set(saved);
            loadPosts();
        }

        async function loadComments(postId, container) {
            const snapshot = await db.ref(`posts/${postId}/comments`).once('value');
            const comments = snapshot.val() || {};
            let html = `<div><input type="text" id="newCom-${postId}" placeholder="কমেন্ট লিখুন..." style="width: 70%; padding: 8px; border-radius: 20px;"><button onclick="addComment('${postId}')">পোস্ট</button></div><div id="commentList-${postId}">`;
            for(let [key, val] of Object.entries(comments)) {
                html += `<p><strong>${val.name}</strong>: ${val.text}</p>`;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        window.addComment = async (postId) => {
            const commentText = document.getElementById(`newCom-${postId}`).value;
            if(!commentText) return;
            const commentId = Date.now();
            const commentData = {
                uid: currentUser.uid,
                name: currentUser.displayName,
                text: commentText,
                time: Date.now()
            };
            await db.ref(`posts/${postId}/comments/${commentId}`).set(commentData);
            loadPosts();
        };

        // ইভেন্ট লিসেনার
        document.getElementById("searchInput").addEventListener("input", (e) => { searchText = e.target.value; loadPosts(); });
        document.querySelectorAll("[data-cat]").forEach(btn => {
            btn.addEventListener("click", () => {
                activeCategory = btn.dataset.cat;
                document.querySelectorAll("[data-cat]").forEach(b => b.classList.remove("chip-active"));
                btn.classList.add("chip-active");
                loadPosts();
            });
        });
        
        document.getElementById("createPostFab").onclick = () => document.getElementById("postModal").style.display = "flex";
        document.getElementById("closeModalBtn").onclick = () => document.getElementById("postModal").style.display = "none";
        document.getElementById("submitPostBtn").onclick = async () => {
            const title = document.getElementById("postTitle").value;
            const division = document.getElementById("postDivision").value;
            const district = document.getElementById("postDistrict").value;
            const upazila = document.getElementById("postUpazila").value;
            const start = document.getElementById("startDate").value;
            const end = document.getElementById("endDate").value;
            const desc = document.getElementById("postDesc").value;
            const cat = document.getElementById("postCategory").value;
            
            if(!title || !division || !district) { alert("মেলার নাম, বিভাগ ও জেলা অবশ্যই দিন"); return; }
            
            const newPostRef = db.ref('posts').push();
            await newPostRef.set({
                title, division, district, upazila, startDate: start, endDate: end,
                description: desc, category: cat, createdAt: Date.now(),
                uid: currentUser.uid, email: currentUser.email
            });
            document.getElementById("postModal").style.display = "none";
            loadPosts();
        };
        
        document.getElementById("supportBtn").onclick = () => {
            const drop = document.getElementById("supportDropdown");
            drop.style.display = drop.style.display === "none" ? "block" : "none";
        };
        document.getElementById("closeSupport").onclick = () => document.getElementById("supportDropdown").style.display = "none";
    </script>
</body>
</html>
