<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এডমিন | বাংলাদেশ মেলা কন্ট্রোল</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', monospace;
        }
        body {
            background: #0b0f19;
            color: #eee;
            padding: 24px;
        }
        .admin-header {
            background: linear-gradient(135deg, #1f2a3e, #0f1522);
            padding: 20px;
            border-radius: 28px;
            margin-bottom: 30px;
            border-left: 6px solid #ffd966;
        }
        .card {
            background: #141c2c;
            border-radius: 24px;
            padding: 22px;
            margin-bottom: 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border: 1px solid #ffd96640;
        }
        input, select, textarea {
            background: #1e2a3a;
            border: 1px solid #ffd96680;
            color: white;
            padding: 12px;
            border-radius: 40px;
            width: 100%;
            margin: 8px 0;
        }
        button {
            background: #ffd966;
            color: #0a0f1a;
            font-weight: bold;
            padding: 12px 24px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        button:hover {
            background: #ffcc44;
            transform: scale(1.02);
        }
        .danger-btn {
            background: #ff6644;
            color: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #2a3448;
            text-align: left;
        }
        img {
            border-radius: 16px;
            max-width: 60px;
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <h1><i class="fa-solid fa-crown"></i> এডমিন প্যানেল - বাংলাদেশ মেলা</h1>
        <p>স্লাইডার কন্ট্রোল | পোস্ট মডারেশন | কন্টাক্ট নম্বর পরিবর্তন | ইউজার ব্লক</p>
    </div>

    <div class="card">
        <h2><i class="fa-regular fa-images"></i> প্রোমো স্লাইডার ইমেজ কন্ট্রোল</h2>
        <input type="text" id="slideUrl" placeholder="ইমেজ URL (ছবির লিংক)">
        <input type="text" id="slideLink" placeholder="ক্লিক করলে লিংক (যেকোনো ওয়েব URL)">
        <button id="addSlideBtn"><i class="fa-solid fa-plus"></i> স্লাইড যোগ করুন</button>
        <div id="slidesList" style="margin-top: 20px;"></div>
    </div>

    <div class="card">
        <h2><i class="fa-solid fa-phone-volume"></i> কন্টাক্ট সাপোর্ট নম্বর পরিবর্তন</h2>
        <input type="text" id="newContactNumber" placeholder="হটলাইন নম্বর">
        <button id="updateContactBtn">আপডেট করুন</button>
    </div>

    <div class="card">
        <h2><i class="fa-solid fa-ban"></i> ইউজার ব্লক (ইমেইল দিয়ে)</h2>
        <input type="email" id="blockEmail" placeholder="ইমেইল লিখুন">
        <button id="blockUserBtn" class="danger-btn">ব্লক করুন</button>
    </div>

    <div class="card">
        <h2><i class="fa-regular fa-newspaper"></i> সকল পোস্ট (ডিলিট অপশন সহ)</h2>
        <div id="allPostsTable"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "123456789",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(() => {
            loadAdminDashboard();
        }).catch(e => console.warn(e));
        
        async function loadAdminDashboard() {
            await loadSlides();
            await loadContact();
            await loadAllPosts();
        }
        
        async function loadSlides() {
            const doc = await db.collection("settings").doc("imageSlider").get();
            const slides = doc.exists ? doc.data().images : [];
            const container = document.getElementById("slidesList");
            if(slides.length === 0) {
                container.innerHTML = "<p>কোনো স্লাইড নেই</p>";
                return;
            }
            container.innerHTML = slides.map((slide, idx) => `
                <div style="display: flex; gap: 16px; align-items: center; margin-bottom: 12px; background: #0f1622; padding: 12px; border-radius: 24px;">
                    <img src="${slide.url}" width="60" height="60" style="object-fit: cover;">
                    <span style="flex:1;">${slide.link.substring(0, 50)}</span>
                    <button onclick="deleteSlide(${idx})" class="danger-btn">ডিলিট</button>
                </div>
            `).join('');
        }
        
        window.deleteSlide = async (index) => {
            const ref = db.collection("settings").doc("imageSlider");
            const data = (await ref.get()).data().images;
            data.splice(index, 1);
            await ref.set({ images: data });
            loadSlides();
        };
        
        document.getElementById("addSlideBtn").onclick = async () => {
            const url = document.getElementById("slideUrl").value;
            const link = document.getElementById("slideLink").value;
            if(!url || !link) { alert("URL ও লিংক দিন"); return; }
            const ref = db.collection("settings").doc("imageSlider");
            const existing = (await ref.get()).data()?.images || [];
            existing.push({ url, link });
            await ref.set({ images: existing });
            document.getElementById("slideUrl").value = "";
            document.getElementById("slideLink").value = "";
            loadSlides();
        };
        
        async function loadContact() {
            const doc = await db.collection("settings").doc("contact").get();
            if(doc.exists) document.getElementById("newContactNumber").value = doc.data().number;
        }
        document.getElementById("updateContactBtn").onclick = async () => {
            const num = document.getElementById("newContactNumber").value;
            await db.collection("settings").doc("contact").set({ number: num });
            alert("নম্বর আপডেট হয়েছে!");
        };
        
        async function loadAllPosts() {
            const snapshot = await db.collection("posts").orderBy("createdAt", "desc").get();
            let html = "<table><tr><th>মেলার নাম</th><th>বিভাগ</th><th>ইউজার UID</th><th>অ্যাকশন</th></tr>";
            snapshot.forEach(doc => {
                const data = doc.data();
                html += `<tr>
                    <td>${data.title}</td>
                    <td>${data.division}</td>
                    <td>${data.uid?.substring(0,12)}...</td>
                    <td><button onclick="deletePostById('${doc.id}')" class="danger-btn">ডিলিট পোস্ট</button></td>
                </tr>`;
            });
            html += "</table>";
            document.getElementById("allPostsTable").innerHTML = html;
        }
        
        window.deletePostById = async (postId) => {
            if(confirm("পোস্ট ডিলিট করবেন?")) {
                await db.collection("posts").doc(postId).delete();
                loadAllPosts();
            }
        };
        
        document.getElementById("blockUserBtn").onclick = async () => {
            const email = document.getElementById("blockEmail").value;
            if(!email) return;
            await db.collection("bannedUsers").doc(email).set({ banned: true });
            alert(`${email} ব্লক করা হয়েছে।`);
        };
    </script>
</body>
</html>
